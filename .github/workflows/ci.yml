# Tests on every push / pull request. The site has no build step: npm is only used for tests.
#
# Optional gated deploy: GitHub → Settings → Pages → Source = "GitHub Actions", then
# Settings → Secrets and variables → Actions → Variables → add PAGES_VIA_ACTIONS = true.
# From then on main is published ONLY when all tests pass. Until then the deploy job is skipped
# and Pages keeps deploying from the branch as before.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg (checks codecs, sound level, frame rate of exported files)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        run: npm run test:unit
      - name: Browsers (Google Chrome is preinstalled on the runner; WebKit for the iPhone project)
        run: npx playwright install --with-deps webkit
      - name: Cache CDN libraries used by the tests
        uses: actions/cache@v4
        with:
          path: tests/.cdn-cache
          key: cdn-${{ hashFiles('index.html', 'js/video-engine.js') }}
          restore-keys: cdn-
      - name: E2E tests (desktop Chrome, Android Chrome, iPhone WebKit)
        run: npx playwright test
      - name: Test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report
          retention-days: 14

  deploy:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
